<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">
<head>
    <title th:text="#{email.reset.title}">F Group Making password reset</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.png|}" />
</head>
<body>
<table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom: 16px;"><tr>
    <td width="40" height="40" align="center" valign="middle" style="border-radius:12px; background-color:#ffffff; border:1px solid #e2e8f0; padding:3px;">
        <img th:src="@{|${baseUrl}/logo.png|}" src="https://fgroupmaking.io.vn/logo.png" alt="F-Group Making" width="34" height="34" style="display:block; border:0; object-fit:contain;" />
    </td>
    <td style="padding-left:12px;"><strong style="font-size:17px;">F-Group Making</strong></td>
</tr></table>
<p th:text="#{email.reset.greeting(${user.email})}">Dear</p>
<p th:text="#{email.reset.text1}">
    For your F Group Making account a password reset was requested, please click on the URL below to reset it:
</p>
<p>
    <a th:with="url=(@{|${baseUrl}/account/reset/finish?key=${user.resetKey}|})" th:href="${url}" th:text="${url}">Login link</a>
</p>
<p>
    <span th:text="#{email.reset.text2}">Regards, </span>
    <br />
    <em th:text="#{email.signature}">F Group Making.</em>
</p>
</body>
</html>
