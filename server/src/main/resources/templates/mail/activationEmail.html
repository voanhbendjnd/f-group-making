<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{email.activation.title}">F Group Making activation</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="icon" th:href="@{|${baseUrl}/favicon.ico|}" />
</head>

<body>
<p th:text="#{email.activation.greeting(${user.email})}">Dear</p>
<p th:text="#{email.activation.text1}">Your F Group Making account has been created, please click on the URL below to
    activate it:</p>
<p>
    <a th:href="@{|${baseUrl}/account/activate?key=${user.activationKey}|}"
       th:text="@{|${baseUrl}/account/activate?key=${user.activationKey}|}">Activation link</a>
</p>
<p>
    <span th:text="#{email.activation.text2}">Regards, </span>
    <br />
    <em th:text="#{email.signature}">F Group Making team.</em>
</p>
</body>

</html>
