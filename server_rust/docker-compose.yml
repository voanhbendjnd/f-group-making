name: fgroup-making-rust-stack

services:
  app-backend-rust:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fgroup-backend-rust
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - DATABASE_URL=mysql://root:1607@mysql-db:3306/fgroup-making
      - DATABASE_MAX_CONNECTIONS=25
      - DATABASE_MIN_CONNECTIONS=5
      - JWT_BASE64_SECRET=nE6Od1T/x2GDldpDXhd9uaXfQupvYU7fCgO4IXPG3B2on76ZvM9hmGT7CR4sOPZmVu8R7u4+Uwy9Zik+fOwq9A==
      - CLIENT_BASE_URL=http://localhost:3000
      - CLIENT_ALLOW_LOCALHOST=true
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM=no-reply@fgroup.local
      - SMTP_STARTTLS=false
      - CLOUDINARY_NAME=dddppjhly
      - CLOUDINARY_KEY=755183448455187
      - CLOUDINARY_SECRET=fjRhyzpRuUEuOaJ-VPqVt6xkjqw
    depends_on:
      mysql-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/management/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  mysql-db:
    image: mysql:8.0
    container_name: mysql-fgroup-making-local
    restart: always
    environment:
      MYSQL_DATABASE: fgroup-making
      MYSQL_ROOT_PASSWORD: 1607
    ports:
      - "3307:3306"
    volumes:
      - "../server/mysql_data:/var/lib/mysql"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1607"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: mailpit-fgroup-making-local
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  redis-happy-farm:
    image: redis:alpine
    container_name: redis-fgroup-making-local
    restart: always
    ports:
      - "6379:6379"
